version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    # Only refresh uv.lock. Bumping the floors in pyproject.toml would
    # needlessly restrict anyone installing the package from PyPI.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
    # Match `exclude-newer` in pyproject.toml, so Dependabot does not
    # propose releases that uv refuses to lock.
    cooldown:
      default-days: 7
    # Major updates match no group, so each gets a PR of its own
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
