version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    # Only refresh uv.lock. Bumping the floors in pyproject.toml would
    # needlessly restrict anyone installing the package from PyPI.
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
