[build-system]
requires = [
    "setuptools>=61.0.0",
    "setuptools_scm>=8.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "zabbix-argus-glue"
description = "Synchronizes Zabbix problems with Argus incidents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Sikt - Norwegian Agency for Shared Services in Education and Research", email = "kontakt@sikt.no"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Monitoring",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp",
    "argus-api-client>=0.7.0",
    "platformdirs",
    "pydantic>=2",
    "zabbix-utils[async]",
]
dynamic = ["version"]

[project.scripts]
zabbix-argus-glue = "zabbixargus:main"

[project.urls]
GitHub = "https://github.com/Uninett/zabbix-argus-glue"
Argus = "https://network.geant.org/argus/"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
test = [
    "pytest>=7",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-argus-server>=0.3.0",
    "tox>=4",
]
maintenance = [
    "towncrier",
]
dev = [
    "ruff",
    "pre-commit",
    {include-group = "maintenance"},
    {include-group = "test"},
]

[tool.uv]
# Older certifi bundles trust the compromised eMudhra/emSign CAs:
# https://discuss.python.org/t/109576
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.pytest.ini_options]
# Pin the Argus server image used by the integration tests. The argus:latest
# image (2.10.0 and 2.10.1 alike) dies at Django setup with
# "ModuleNotFoundError: No module named 'django_tasks'". Argus lists
# django_tasks in INSTALLED_APPS, but django-tasks-db 0.13.0 no longer
# depends on django-tasks. 2.9.1 still bundles it.
# TODO: Drop this pin once a fixed Argus image is published
addopts = "--argus-version 2.9.1"
asyncio_mode = "auto"
markers = [
    "integration: requires a running Argus server (Docker)",
]

[tool.ruff]
line-length = 88
extend-exclude = [
    ".egg-info",
    "docs",
]
output-format = "full"
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["I"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/Uninett/zabbix-argus-glue/issues/{issue})"
wrap = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
