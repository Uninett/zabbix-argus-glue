[tox]
# 1.22.1 is the first lock runner to imply --no-default-groups
requires = tox-uv>=1.22.1
envlist = py{311,312,313,314}
skip_missing_interpreters = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
runner = uv-venv-lock-runner
package = editable
dependency_groups = test
commands =
    pytest -o junit_suite_name="{envname} tests" \
        --cov={toxinidir}/src \
        --cov-report=xml:reports/{envname}/coverage.xml \
        --junitxml=reports/{envname}/test-results.xml \
        --verbose {posargs}
